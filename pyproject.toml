[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "terralyra-ignis-models"
version = "0.0.1.dev0"
description = "Experimental public IGNIS observation models"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[tool.setuptools]
packages = ["terralyra_ignis_models"]
include-package-data = false

[tool.setuptools.package-dir]
terralyra_ignis_models = "custom_components/terralyra_ignis/basic_models"
