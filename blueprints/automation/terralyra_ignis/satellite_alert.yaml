blueprint:
  name: TerraLyra IGNIS — short satellite fire notification
  description: >-
    Send a short notification to a Home Assistant Companion App phone when IGNIS
    observes a satellite incident entering a location's alert radius. Requires
    IGNIS 0.33.0 or newer. Configure monitoring and alert radii in IGNIS first.
    Choose Hungarian or English notification text below. The first snapshot after
    startup establishes a quiet baseline. Official reports do not trigger this
    automation. Disable any replaced notification automation to avoid duplicates.
  domain: automation
  author: TerraLyra
  homeassistant:
    min_version: "2026.9.0"
  input:
    ignis_entry:
      name: IGNIS installation / IGNIS-példány
      selector:
        config_entry:
          integration: terralyra_ignis
    phone:
      name: Phone / Telefon
      description: A Companion App device with push notifications enabled.
      selector:
        device:
          filter:
            integration: mobile_app
    language:
      name: Notification language / Értesítés nyelve
      default: en
      selector:
        select:
          options:
            - label: Magyar
              value: hu
            - label: English
              value: en

variables:
  notification_language: !input language

triggers:
  - trigger: event
    event_type: terralyra_ignis_fire_alert
    event_data:
      config_entry_id: !input ignis_entry

# Keep this guard inside actions too: manually running actions has no event.
actions:
  - condition: template
    value_template: >-
      {{ trigger is defined and trigger.platform == 'event'
         and (trigger.event.data.get('alert_locations', []) | count > 0) }}
  - device_id: !input phone
    domain: mobile_app
    type: notify
    title: >-
      {%- set names = trigger.event.data.alert_locations | map(attribute='location_name') | join(', ') -%}
      {{ 'Tűz észlelés ' ~ names ~ ' közelében' if notification_language == 'hu'
         else 'Fire detected near ' ~ names }}
    message: >-
      {%- set hu = {'N':'északra','NNE':'észak-északkeletre','NE':'északkeletre','ENE':'kelet-északkeletre','E':'keletre','ESE':'kelet-délkeletre','SE':'délkeletre','SSE':'dél-délkeletre','S':'délre','SSW':'dél-délnyugatra','SW':'délnyugatra','WSW':'nyugat-délnyugatra','W':'nyugatra','WNW':'nyugat-északnyugatra','NW':'északnyugatra','NNW':'észak-északnyugatra'} -%}
      {%- set en = {'N':'north','NNE':'north-northeast','NE':'northeast','ENE':'east-northeast','E':'east','ESE':'east-southeast','SE':'southeast','SSE':'south-southeast','S':'south','SSW':'south-southwest','SW':'southwest','WSW':'west-southwest','W':'west','WNW':'west-northwest','NW':'northwest','NNW':'north-northwest'} -%}
      {%- for place in trigger.event.data.alert_locations -%}
        {%- set distance = '%.1f' | format(place.distance_km | float) -%}
        {%- if notification_language == 'hu' -%}
          {{ 'Tűz észlelve ' ~ distance | replace('.', ',') ~ 'km-re a ' ~ place.location_name ~ ' ponttól' }}{{ ' ' ~ hu[place.direction] if place.get('direction') in hu else '' }}
        {%- else -%}
          {{ 'Fire detected ' ~ distance ~ ' km ' }}{{ en[place.direction] ~ ' of ' if place.get('direction') in en else 'from ' }}{{ place.location_name }}
        {%- endif -%}
        {{- '. ' if not loop.last else '' -}}
      {%- endfor -%}

mode: queued
max: 10
