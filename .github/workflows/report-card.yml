name: Report map card
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Model checks
        run: node --test tests/frontend/report-map.test.mjs
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/ignis-ui" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/ignis-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser checks
        run: NODE_PATH="$RUNNER_TEMP/ignis-ui/node_modules" node tests/frontend/report-map-browser.cjs
      - name: BM report card browser checks
        run: NODE_PATH="$RUNNER_TEMP/ignis-ui/node_modules" node tests/frontend/bm-reports-browser.cjs
