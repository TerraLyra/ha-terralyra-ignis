name: Basic model packaging pilot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      # The default build first creates the sdist, then builds the wheel from it.
      - run: python -m build
      - name: Inspect standalone source archive
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          source, = Path('dist').glob('*.tar.gz')
          expected = {
              'LICENSE', 'MANIFEST.in', 'PKG-INFO', 'pyproject.toml', 'setup.cfg',
              'docs/BASIC_MODEL_PACKAGE.md',
              'terralyra_ignis_models.egg-info/SOURCES.txt',
              'custom_components/terralyra_ignis/basic_models/__init__.py',
          }
          with tarfile.open(source) as archive:
              names = set()
              for member in archive.getmembers():
                  assert member.isdir() or member.isfile(), member.name
                  if member.isfile():
                      relative = member.name.split('/', 1)[1]
                      names.add(relative)
              assert names == expected, names
          PY
      - name: Inspect allowlisted wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheel, = Path('dist').glob('*.whl')
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert 'terralyra_ignis_models/__init__.py' in names
              assert all(n == 'terralyra_ignis_models/__init__.py' or n.startswith('terralyra_ignis_models-0.0.1.dev0.dist-info/') for n in names), names
              metadata = archive.read('terralyra_ignis_models-0.0.1.dev0.dist-info/METADATA').decode()
              assert 'Requires-Dist:' not in metadata
          PY
      - name: Install and import without Home Assistant
        run: |
          python -m venv /tmp/model-consumer
          /tmp/model-consumer/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/model-consumer/bin/python -I - <<'PY'
          from datetime import datetime, timezone
          import sys
          from terralyra_ignis_models import FireDetection, ProviderSnapshot, ProviderStatus
          now = datetime.now(timezone.utc)
          detection = FireDetection('synthetic', 'test', 'test', now, 0.0, 0.0, frp_mw=0.0)
          snapshot = ProviderSnapshot('synthetic', 'test', 'test', now, now, ProviderStatus.AVAILABLE, 'https://example.invalid', 'synthetic', (detection,))
          assert snapshot.detections[0] is detection
          assert detection.frp_mw == 0.0 and detection.confidence is None
          assert snapshot.status.value == 'available'
          assert not any(n.startswith(('homeassistant', 'custom_components')) for n in sys.modules)
          PY
