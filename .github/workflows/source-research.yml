name: Official source research
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    name: Offline source checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run synthetic offline checks
        run: python -m unittest discover -s tools/source_research -v
      - name: Validate research metadata JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for pattern in ('*_SAMPLE_METADATA_*.json', 'ACT_OFFLINE_SUMMARY_*.json'):
              for path in Path('docs').glob(pattern):
                  json.loads(path.read_text())
          PY

  canada:
    name: Canada research client (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r tools/source_research/canada/requirements-test.txt
      - run: python -m unittest discover -s tools/source_research/canada -v
